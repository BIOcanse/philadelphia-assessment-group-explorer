name: Deploy released browser edition
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        default: v1.4.0
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the browser release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "group-explorer-browser-${RELEASE_TAG}.zip" --pattern SHA256SUMS.txt --dir release
          (cd release && sha256sum --check --ignore-missing SHA256SUMS.txt)
          unzip -q "release/group-explorer-browser-${RELEASE_TAG}.zip" -d published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
